<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理編輯</title><style>
:root{--ink:#17352e;--paper:#fcfbf7;--cream:#f5f1e8;--gold:#d49b52;--line:#d8ddd6;--muted:#64736d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}.top{position:sticky;top:0;z-index:20;height:64px;padding:0 5%;display:flex;align-items:center;background:var(--paper);border-bottom:1px solid var(--line)}.brand{color:var(--ink);text-decoration:none;font-weight:700}.brand i{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:10px;border-radius:50%;background:var(--ink);color:#fff;font:12px Georgia}.gate{max-width:430px;margin:14vh auto;padding:38px;background:#fff;border:1px solid var(--line)}h1,h2{font:32px Georgia}.button,select{font:inherit}.button{padding:10px 15px;border:0;background:var(--gold);color:var(--ink);font-weight:700;cursor:pointer}.app{display:none}.app.on{display:block}.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 64px);align-items:start}.controls{position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;padding:26px;background:var(--cream);border-right:1px solid var(--line)}.controls select{width:100%;padding:11px;margin:8px 0 20px}.controls .button{display:block;width:100%;margin:10px 0}.status{min-height:24px;color:#26734d;font-size:13px}.editor{margin:22px;min-height:calc(100vh - 130px);background:#fff;border:1px solid var(--line);padding:40px;outline:none;font-family:Arial,"Noto Sans TC",sans-serif;line-height:1.8}.toolbar{position:sticky;top:64px;z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--cream);border-bottom:1px solid var(--line)}.toolbar select,.toolbar input{padding:8px;border:1px solid #b9c5bc;background:#fff}.toolbar input{width:42px;height:38px}.hint{font-size:12px;color:var(--muted);margin-right:auto}.editor h1,.editor h2,.editor h3{font-family:Georgia,"Noto Serif TC",serif}.editor h1 em{font-size:50%;color:#6f8f7b;font-weight:400}@media(max-width:800px){.layout{grid-template-columns:1fr}.controls{position:sticky;top:64px;height:auto;max-height:42vh;border:0;border-bottom:1px solid var(--line)}}
</style></head><body><div class="top"><a class="brand" href="index.html"><i>XL</i> 卓越領導力©核心課程</a></div><section id="gate" class="gate"><small>PRIVATE ADMINISTRATION</small><h1>管理編輯</h1><p>本機管理頁，不需要密碼。</p><button id="enter" class="button">進入管理頁</button></section><section id="app" class="app"><div class="layout"><aside class="controls"><h2>頁面</h2><select id="page"><option value="LPI_Coach_Chapter01.html">Module 01｜五項實踐</option><option value="LPI_Coach_Chapter02.html">Module 02｜五項實踐</option><option value="LPI_Coach_Chapter03.html">Module 03｜五項實踐</option><option value="LPI_Coach_Chapter04.html">Module 04｜五項實踐</option><option value="LPI_Coach_Chapter05.html">Module 05｜五項實踐</option><option value="LPI_Coach_Chapter06.html">Module 06｜五項實踐</option></select><button id="save" class="button">儲存並更新 HTML</button><button id="undo" class="button">復原上一個狀態</button><button id="leave" class="button">離開管理頁</button><div id="status" class="status">尚未儲存</div><p class="hint">右側內容可直接輸入。先選取文字，再套用工具列格式。</p></aside><main><div class="toolbar"><button class="button" id="formatUndo" data-cmd="undo" title="復原">↶</button><button class="button" id="formatRedo" data-cmd="redo" title="重做">↷</button><span class="toolbar-sep"></span><select id="blockFormat" title="段落格式"><option value="p">段落</option><option value="h2">標題 2</option><option value="h3">標題 3</option><option value="blockquote">引用</option></select><select id="font" title="字體"><option value="">原始樣式</option><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Noto Sans TC">Noto Sans TC</option></select><select id="size" title="字級"><option value="12px">12px</option><option value="14px">14px</option><option value="16px">16px</option><option value="20px">20px</option><option value="24px">24px</option><option value="32px">32px</option></select><input id="color" type="color" value="#17352e" title="文字顏色"><button id="applyColor" class="button" title="文字顏色">A</button><button class="button" data-cmd="bold" title="粗體"><b>B</b></button><button class="button" data-cmd="italic" title="斜體"><i>I</i></button><button class="button" id="link" title="插入連結">🔗</button><select id="listType" title="清單"><option value="">清單</option><option value="insertUnorderedList">項目符號</option><option value="insertOrderedList">編號清單</option></select></div><article id="editor" class="editor" contenteditable="true" spellcheck="false"></article></main></div></section><script>
const $=id=>document.getElementById(id),page=$('page'),editor=$('editor');let current=page.value,password='';$('enter').onclick=()=>{$('gate').style.display='none';$('app').classList.add('on');load()};$('leave').onclick=()=>location.reload();page.onchange=load;async function load(){current=page.value;const html=await fetch(current).then(r=>r.text()),doc=new DOMParser().parseFromString(html,'text/html');editor.innerHTML=doc.querySelector('main')?.innerHTML||'';editor.focus()}function cmd(c,v=null){editor.focus();document.execCommand(c,false,v)}document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>cmd(b.dataset.cmd));$('font').onchange=()=>cmd('fontName',$('font').value);$('size').onchange=()=>{const s=window.getSelection();if(!s.rangeCount||s.isCollapsed){$('status').textContent='請先選取文字再設定字級';return}const r=s.getRangeAt(0),span=document.createElement('span');span.style.fontSize=$('size').value;span.appendChild(r.extractContents());r.insertNode(span)};$('applyColor').onclick=()=>cmd('foreColor',$('color').value);$('save').onclick=async()=>{const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,page:current,main:editor.innerHTML,fontSize:1,textColor:'#17352e'})});$('status').textContent=r.ok?'✓ 已成功寫回 '+current:'✕ 儲存失敗，請確認 localhost 伺服器'};$('undo').onclick=async()=>{const r=await fetch('/api/undo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,page:current})});$('status').textContent=r.ok?'✓ 已復原上一個狀態':'沒有可復原狀態';if(r.ok)load()};load();
$('blockFormat').onchange=()=>{const e=editBlock();if(e){const n=document.createElement($('blockFormat').value);n.innerHTML=e.innerHTML;e.replaceWith(n)}};$('link').onclick=()=>{const e=editBlock();if(e){const u=prompt("請輸入連結網址","https://");if(u){const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";a.innerHTML=e.innerHTML;e.replaceWith(a)}}};</script></body></html>
